# Generated by /ticket:init on 2026-07-26. Hand-edit freely.
version: 1

# --- Identity ----------------------------------------------------------
ticket_id:
  prefix: BHS   # ticket IDs look like BHS-001
  padding: 3
  start: 1

# --- Lifecycle: role-based stages -------------------------------------
lifecycle:
  stages:
    - key: inbox
      label: "Inbox"
      roles: [inbox]
      filesystem:
        folder: inbox
    - key: backlog
      label: "Backlog"
      roles: [pickable]
      filesystem:
        folder: backlog
    - key: in-progress
      label: "In progress"
      roles: [in_progress]
      filesystem:
        folder: in-progress
    - key: in-review
      label: "In review"
      roles: [review]
      filesystem:
        folder: in-review
    - key: done
      label: "Done"
      roles: [terminal]
      filesystem:
        folder: done

# --- Backend ----------------------------------------------------------
backend:
  type: filesystem
  filesystem:
    root: docs/project
    filename: "{id}-{slug}.md"
    transition: git_mv
    commit_per_transition: true

# --- Types ------------------------------------------------------------
types:
  feature:
    required_body_sections: [why, acceptance_criteria, ux_surface, architecture_notes, research, out_of_scope]
  bug:
    required_body_sections: [repro_steps, expected, actual, suspected_cause, regression_test, architecture_notes]
  tech:
    required_body_sections: [goal, approach, verification]
  spike:
    required_body_sections: [question, time_budget, approach]

# --- Effort -----------------------------------------------------------
effort:
  allowed:         [S, M, L, XL]
  pickable_allowed: [S, M]

# --- Claim / staleness ------------------------------------------------
claim:
  stale_after: 24h

# --- Milestones -------------------------------------------------------
milestones:
  strategy: auto
  trackers:
    planned_active_folder: milestone
    shipped_folder: done

# --- GitHub Project (v2) linkage (github backend only; optional) ------
projects:
  enabled: false

# --- Git branch workflow -----------------------------------------------
git:
  branch_workflow: enabled
  branch_prefix: "feature/"
  merge_strategy: squash
  pr_integration: none

# --- Commit / activity messages ---------------------------------------
commits:
  new:            "ticket: new {id} {title}"
  capture:        "ticket: capture {id} {title}"
  capture_update: "ticket: capture-update {id}"
  refine:         "ticket: refine {id} {title}"
  claim:          "ticket: claim {id} {title}"
  abandon:        "ticket: abandon {id} {title}"
  update:         "ticket: update {id} {title}"
  review:         "ticket: review {id} {title}"
  reject:         "ticket: reject {id} {title}"
  done:           "ticket: done {id} {title}"
  fold:           "ticket: fold {id} into {target_id}"
  wontfix:        "ticket: wontfix {id} {title}"
  milestone_flip: "milestone: {status} {version} — {reason}"

# --- Agents -------------------------------------------------------------
research:
  agents:
    - name: perf-expert
      consult: "the work could affect latency, memory, or throughput"
    - name: language-expert
      consult: "language-level design questions or idioms"
review:
  agents: [code-reviewer, test-adequacy-reviewer]
  plan_advisors: [security-advisor]
  advisors: [perf-advisor]

# --- Project references (all optional) --------------------------------
references:
  architecture:   null
  conventions:    null
  roadmap:        null
  template:       docs/project/TICKET_TEMPLATE.md
  project_readme: null

# --- Verification -----------------------------------------------------
verification:
  test_commands: []
  build_command: null
  pre_close_command: null
  max_loop_rounds: 3
