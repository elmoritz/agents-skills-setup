# Generated by /ticket:init on 2026-07-26. Hand-edit freely.
version: 1

# --- Identity ----------------------------------------------------------
ticket_id:
  prefix: BHS
  padding: 3
  start: 1

# --- Lifecycle: role-based stages -------------------------------------
lifecycle:
  stages:
    - key: backlog
      label: "Backlog"
      roles: [pickable]
      github:
        label: "status:backlog"
    - key: in-progress
      label: "In progress"
      roles: [in_progress]
      github:
        label: "status:in-progress"
    - key: in-review
      label: "In review"
      roles: [review]
      github:
        label: "status:in-review"
    - key: done
      label: "Done"
      roles: [terminal]
      github:
        label: "status:done"
        close_issue: true

# --- Backend ----------------------------------------------------------
backend:
  type: github
  github:
    repo: honey/bee-hive-sim
    type_label_prefix: "type:"
    priority_label_prefix: "prio:"
    effort_label_prefix: "effort:"
    risk_label_prefix: "risk:"
    type_map:
      feature: "Feature"
      bug: "Bug"

# --- Types ------------------------------------------------------------
types:
  feature:
    required_body_sections: [why, acceptance_criteria, ux_surface, architecture_notes, research, out_of_scope]
  bug:
    required_body_sections: [repro_steps, expected, actual, suspected_cause, regression_test, architecture_notes]
  tech:
    required_body_sections: [goal, approach, verification]
  spike:
    required_body_sections: [question, time_budget, approach]

# --- Effort -----------------------------------------------------------
effort:
  allowed:         [S, M, L, XL]
  pickable_allowed: [S, M]

# --- Claim / staleness ------------------------------------------------
claim:
  stale_after: 3d

# --- Milestones -------------------------------------------------------
milestones:
  strategy: auto

# --- GitHub Project (v2) linkage --------------------------------------
projects:
  enabled: true
  number:       7
  owner:        honey
  owner_type:   org
  status_field: "Status"
  status_map:
    inbox:       "Backlog"
    pickable:    "Backlog"
    in_progress: "In progress"
    review:      "In review"
    terminal:    "Done"
  field_map:
    priority: "Priority"
    effort:   "Effort"
    risk:     "Risk"

# --- Commit / activity messages ---------------------------------------
commits:
  new:            "ticket: new {id} {title}"
  capture:        "ticket: capture {id} {title}"
  capture_update: "ticket: capture-update {id}"
  refine:         "ticket: refine {id} {title}"
  claim:          "ticket: claim {id} {title}"
  abandon:        "ticket: abandon {id} {title}"
  update:         "ticket: update {id} {title}"
  review:         "ticket: review {id} {title}"
  reject:         "ticket: reject {id} {title}"
  done:           "ticket: done {id} {title}"
  fold:           "ticket: fold {id} into {target_id}"
  wontfix:        "ticket: wontfix {id} {title}"
  milestone_flip: "milestone: {status} {version} — {reason}"

# --- Agents -------------------------------------------------------------
review:
  agents: [code-reviewer, test-adequacy-reviewer]

# --- Project references ------------------------------------------------
references:
  architecture:   null
  conventions:    null
  roadmap:        null
  template:       null
  project_readme: null

# --- Verification -----------------------------------------------------
verification:
  test_commands: []
  build_command: null
  pre_close_command: null
  max_loop_rounds: 3
