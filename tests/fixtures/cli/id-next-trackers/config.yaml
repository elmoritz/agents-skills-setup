version: 1
ticket_id:
  prefix: TE
  padding: 3
  start: 1
lifecycle:
  stages:
    - key: backlog
      label: "Backlog"
      roles: [pickable]
      filesystem:
        folder: backlog
    - key: in-progress
      label: "In progress"
      roles: [in_progress]
      filesystem:
        folder: in-progress
    - key: done
      label: "Done"
      roles: [terminal]
      filesystem:
        folder: done
backend:
  type: filesystem
  filesystem:
    root: proj
    filename: "{id}-{slug}.md"
types:
  feature:
    required_body_sections: [why, acceptance_criteria]
  bug:
    required_body_sections: [repro_steps, regression_test]
  tech:
    required_body_sections: [goal, approach]
effort:
  allowed: [S, M, L, XL]
  pickable_allowed: [S, M]
milestones:
  strategy: trackers
  trackers:
    planned_active_folder: milestone
    shipped_folder: done
commits:
  claim: "ticket: claim {id} {title}"
  fold: "ticket: fold {id} into {target_id}"
  done: "ticket: done {id} {title}"
  milestone_flip: "milestone: {status} {version} — {reason}"
